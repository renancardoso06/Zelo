name: zelo_app
description: Zelo — Marketplace Inteligente de Serviços Domésticos
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Estado
  provider: ^6.1.1

  # Navegação
  go_router: ^13.2.0

  # Google Maps e Geolocalização
  google_maps_flutter: ^2.6.0
  geolocator: ^11.0.0

  # Firebase
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.0

  # HTTP / API
  http: ^1.2.1
  dio: ^5.4.3

  # Persistência local
  shared_preferences: ^2.2.3

  # UI
  cached_network_image: ^3.3.1
  flutter_rating_bar: ^4.0.1
  shimmer: ^3.0.0
  intl: ^0.19.0

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
